<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapTok - TikTok Video Downloader</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">SnapTok</h1>
            <p class="subtitle">Download TikTok videos without watermark</p>
        </header>

        <!-- Downloader Card -->
        <div class="card">
            <div class="input-group">
                <input type="url" id="url" placeholder="Paste TikTok link here..." autocomplete="off">
                <div class="input-actions">
                    <button id="pasteBtn" class="action-btn" title="Paste link">Paste</button>
                    <button id="clearBtn" class="action-btn clear-btn" title="Clear">✕</button>
                </div>
            </div>

            <button id="downloadBtn" class="btn primary-btn">Get Video</button>

            <!-- Status -->
            <p id="status" class="status-msg">Ready to download.</p>

            <!-- Results -->
            <div id="result" class="result-box hidden">
                <div class="result-header">
                    <span id="resultTitle" class="username">@user</span>
                    <span class="badge">No Watermark</span>
                </div>
                
                <div id="resultContent"></div>
            </div>
        </div>
        
        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 SnapTok — Fast & Secure</p>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
