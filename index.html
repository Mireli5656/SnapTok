<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapTok - TikTok Video Downloader</title>
  <!-- CSS faylını bura bağlayırıq -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <h1 id="title">SnapTok</h1>
    <p id="subtitle">Simple, fast and free TikTok video downloader.</p>
    
    <input id="url" type="text" placeholder="Paste TikTok URL here..." autocomplete="off" />
    <p id="errorMsg" class="error-text"></p>
    
    <button id="downloadBtn">Get Video</button>

    <!-- Yükləmə Nəticələri -->
    <div id="resultBox">
      <div class="video-info">
        <img id="videoThumb" src="" alt="Thumbnail">
        <p id="videoTitle"></p>
      </div>
      <a id="btnNoWatermark" href="#" target="_blank" class="download-btn">Download (No Watermark)</a>
      <a id="btnHD" href="#" target="_blank" class="download-btn hd">Download HD</a>
    </div>
  </div>

  <!-- JS faylını bura bağlayırıq -->
  <script src="script.js"></script>
</body>
</html>
