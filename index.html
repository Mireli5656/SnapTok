<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>SnapTok</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1>SnapTok</h1>
          <p>Simple, fast and clean link tool.</p>
        </div>
      </div>

      <div class="hero">
        <h2>Paste your link</h2>
        <p>Minimal design, fast input, no clutter.</p>
      </div>

      <label class="sr-only" for="url">Link</label>
      <input
        id="url"
        type="url"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="https://..."
      />

      <div class="actions">
        <button id="pasteBtn" class="btn secondary" type="button">Paste</button>
        <button id="clearBtn" class="btn ghost" type="button">Clear</button>
      </div>

      <button id="downloadBtn" class="btn primary" type="button">
        Download
      </button>

      <div id="status" class="status" aria-live="polite">
        Ready when you are.
      </div>

      <div id="result" class="result hidden">
        <div class="result-head">
          <strong id="resultTitle">Ready</strong>
          <span id="resultBadge" class="badge">Idle</span>
        </div>
        <p id="resultText">Your result will appear here.</p>
      </div>

      <div class="features">
        <div class="feature">
          <strong>No clutter</strong>
          <span>Simple interface</span>
        </div>
        <div class="feature">
          <strong>Fast UI</strong>
          <span>Lightweight</span>
        </div>
        <div class="feature">
          <strong>Mobile friendly</strong>
          <span>Responsive layout</span>
        </div>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
        </html>
