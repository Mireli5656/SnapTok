<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTok - TikTok Video Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <div class="box">
            <h1 id="title">SnapTok</h1>
            <p id="subtitle">Hızlı, ücretsiz ve filigransız TikTok video indirici.</p>
            
            <div class="input-group">
                <input type="text" id="url" placeholder="TikTok video linkini buraya yapıştırın..." autocomplete="off">
                <button type="button" id="downloadBtn">İndir</button>
            </div>

            <div id="resultContainer"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
