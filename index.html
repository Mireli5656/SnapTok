<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTok - TikTok Video Downloader (No Watermark)</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">SnapTok</h1>
            <p class="subtitle">Download TikTok videos without watermark instantly.</p>
        </header>

        <!-- Downloader Container -->
        <div class="downloader-card">
            <div class="input-wrapper">
                <input type="url" id="url" placeholder="Paste TikTok link here..." autocomplete="off">
                <button id="pasteBtn" class="action-btn" title="Paste link">Paste</button>
                <button id="clearBtn" class="action-btn clear-btn" title="Clear input">✕</button>
            </div>

            <button id="downloadBtn" class="btn primary-btn">Get Video</button>

            <!-- Status Indicator -->
            <p id="status" class="status-msg">Ready to download.</p>

            <!-- Results Section -->
            <div id="result" class="result-section hidden">
                <div class="result-header">
                    <span id="resultTitle" class="username">@user</span>
                    <span id="resultBadge" class="badge">Success</span>
                </div>
                
                <div id="resultText"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 SnapTok. Fast & Free TikTok Downloader.</p>
        </footer>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
